---
layout: default
---

<div class="project-layout">

  <!-- LEFT SIDEBAR THAT ONLY SHOWS ON PROJECT PAGES -->
  <aside class="project-sidebar">
    <h2 class="project-sidebar-title">Projects</h2>
    <ul class="project-sidebar-links">
      {% for p in site.projects %}
        <li>
          <a href="{{ p.url | relative_url }}"{% if p.url == page.url %} class="active"{% endif %}>
            {{ p.title }}
          </a>
        </li>
      {% endfor %}
    </ul>

    <a href="{{ "/projects/" | relative_url }}" class="project-back-link">
      ← Back to Projects
    </a>
  </aside>

  <!-- MAIN CONTENT (WHAT YOU ALREADY HAD) -->
  <div class="project-main">
    <h1>{{ page.title }}</h1>

    {% if page.image %}
      <p>
        <img src="{{ page.image | relative_url }}"
             alt="{{ page.imagealt }}"
             class="project-image" />
      </p>
    {% endif %}

    {{ content }}

    {% if page.skills %}
      <p><strong>Skills Used</strong>: {{ page.skills | join: ", " }}</p>
    {% endif %}
  </div>

</div>
